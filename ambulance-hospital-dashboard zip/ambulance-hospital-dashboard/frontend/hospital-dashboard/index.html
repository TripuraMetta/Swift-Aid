<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .dashboard { width: 90%; max-width: 1000px; background: white; padding: 20px; box-shadow: 0 5px 10px rgba(0,0,0,0.1); border-radius: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px; }
        .clock { font-size: 18px; font-weight: bold; }
        .cards { display: flex; gap: 20px; margin-top: 20px; }
        .card { flex: 1; background: #28a745; color: white; padding: 20px; border-radius: 10px; text-align: center; position: relative; }
        .card i { font-size: 30px; }
        .btn { margin-top: 10px; padding: 8px 12px; background: white; color: #dc3545; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn:hover { background: #f1f1f1; }
        .iframe-container { margin-top: 20px; text-align: center; }
        iframe { width: 100%; height: 400px; border: none; border-radius: 10px; }
        #alert-container { margin-top: 20px; color: #dc3545; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h2>🏥 Hospital Dashboard</h2>
            <div class="clock" id="clock">00:00:00</div>
        </div>
        <div class="cards">
            <div class="card">
                <i class="fas fa-users"></i>
                <h3>Patient Health Condition</h3>
                <button class="btn" onclick="receiveHealthAlert()">Receive health updates</button>
            </div>
            <div class="card" style="background: #dc3545;">
                <i class="fas fa-bell"></i>
                <h3><a href="ambulance_dashboard.html" style="color: white; text-decoration: none;">Alert</a></h3>
                <button class="btn" onclick="receiveHealthAlert()">Recieved Alert</button>
            </div>
        </div>
        <div class="iframe-container">
            <h3>Live Tracking of Ambulance</h3>
            <!-- Make sure the map URL is valid -->
            <iframe id="mapFrame" src="C:\Users\User\OneDrive\Desktop\HackNight_25 Code\LTU.html" title="Live Tracking Map"></iframe>
        </div>

        <!-- Alert container to display the alert information -->
        <div id="alert-container"></div>
    </div>
    
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById("clock").textContent = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);

        function receiveHealthAlert() {
            const alertData = JSON.parse(localStorage.getItem("healthAlert"));

            if (!alertData) {
                alert("No alerts received yet.");
            } else {
                // Display the received alert data
                document.getElementById("alert-container").innerHTML = `
                    <h3 style="color: #dc3545;">🚨 Emergency Alert Received</h3>
                    <p><strong>Patient ID:</strong> ${alertData.patientID}</p>
                    <p><strong>Condition:</strong> ${alertData.condition}</p>
                    <p><strong>Symptoms:</strong> ${alertData.symptoms}</p>
                    <p><strong>Location:</strong> ${alertData.location}</p>
                    <p><strong>Time:</strong> ${alertData.timestamp}</p>
                `;
            }

            // Check for the ambulance location from localStorage and update the map
            const ambulanceLocation = localStorage.getItem('ambulanceLocation');
            if (ambulanceLocation) {
                // Parse the location and update the map accordingly
                console.log('Ambulance Location:', ambulanceLocation);
                // Update the iframe or map here based on the coordinates.
            }
        }
    </script>
</body>
</html>
